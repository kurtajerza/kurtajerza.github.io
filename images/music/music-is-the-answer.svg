<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#26262a"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </radialGradient>
    <style>
      .t{font-family:"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive;font-weight:700;text-anchor:middle}
    </style>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <!-- groove rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".07">
    <circle cx="400" cy="400" r="380"/><circle cx="400" cy="400" r="350"/><circle cx="400" cy="400" r="320"/>
    <circle cx="400" cy="400" r="290"/><circle cx="400" cy="400" r="260"/><circle cx="400" cy="400" r="230"/>
    <circle cx="400" cy="400" r="200"/>
  </g>
  <!-- painted lettering: lavender shadow, then pale blue -->
  <g class="t" transform="rotate(-4 400 400)">
    <g fill="#b9a7e6" transform="translate(5 5)">
      <text x="400" y="215" font-size="124">Music</text>
      <text x="400" y="372" font-size="108">is the</text>
      <text x="400" y="580" font-size="150">answer</text>
    </g>
    <g fill="#a9c7f2" stroke="#e8f1ff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">
      <text x="400" y="215" font-size="124">Music</text>
      <text x="400" y="372" font-size="108">is the</text>
      <text x="400" y="580" font-size="150">answer</text>
    </g>
  </g>
  <!-- paper label -->
  <circle cx="400" cy="400" r="112" fill="#e9dca8"/>
  <circle cx="400" cy="400" r="112" fill="none" stroke="#8a7a45" stroke-opacity=".5" stroke-width="2"/>
  <g stroke="#6d6030" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
    <line x1="338" y1="372" x2="462" y2="372"/><line x1="332" y1="392" x2="468" y2="392"/>
    <line x1="338" y1="430" x2="462" y2="430"/><line x1="350" y1="450" x2="450" y2="450"/>
  </g>
</svg>
